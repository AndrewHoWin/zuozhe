<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古代作家與作品閃卡特訓班 (分組記憶與綜合版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            color: #1e293b;
            margin: 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 14px 44px 0 rgba(31, 38, 135, 0.16);
        }
        .target-char {
            color: #1e3a8a;
            font-weight: 900;
            border-bottom: 5px solid #4f46e5;
            padding-bottom: 4px;
            display: inline-block;
        }
        /* 一般考點填空槽 (朝代、字號、世稱、並稱、稱譽) */
        .cloze-blank {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-indent: 0 !important;
            padding: 1px 10px;
            margin: 2px 3px;
            border-bottom: 3px solid #6366f1;
            background-color: #eef2ff;
            color: #4f46e5;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: all 0.18s ease;
            vertical-align: baseline;
            text-align: center;
            font-weight: 900;
            line-height: 1.5;
        }
        .cloze-blank:hover {
            background-color: #e0e7ff;
        }
        .cloze-blank.revealed {
            background-color: #dcfce7;
            border-bottom: 3px solid #16a34a;
            color: #14532d;
            font-weight: 900;
        }
        /* 作品與文集填空槽 《...》 */
        .cloze-work {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-indent: 0 !important;
            padding: 1px 8px;
            margin: 2px 3px;
            border-bottom: 3px solid #4f46e5;
            background-color: #e0e7ff;
            color: #4338ca;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: all 0.18s ease;
            vertical-align: baseline;
            text-align: center;
            font-weight: 900;
            line-height: 1.5;
        }
        .cloze-work:hover {
            background-color: #c7d2fe;
        }
        .cloze-work.revealed {
            background-color: #dbeafe;
            border-bottom: 3px solid #1d4ed8;
            color: #1e3a8a;
            font-weight: 900;
        }
        .btn-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
        }
        .btn-hover:active {
            transform: scale(0.96);
        }
        .group-pill {
            transition: all 0.18s ease;
        }
        .group-pill.active {
            background-color: #4f46e5;
            color: #ffffff;
            border-color: #4338ca;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 md:p-8">

    <div id="app" class="glass-card w-full max-w-3xl rounded-3xl p-5 sm:p-8 md:p-10 flex flex-col items-center relative overflow-hidden fade-in">
        
        <!-- 頂部標題與剩餘題數 -->
        <div class="w-full flex flex-col sm:flex-row justify-between items-center gap-3 mb-4 border-b border-indigo-200/80 pb-4">
            <div class="flex items-center gap-2">
                <h1 class="text-xl md:text-2xl font-black tracking-widest text-indigo-950">
                    ✒️ 古代作家與作品閃卡特訓
                </h1>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <select id="deck-selector" onchange="changeDeck(this.value)" class="text-xs md:text-sm font-bold bg-white border border-indigo-200 text-indigo-900 rounded-full px-3.5 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
                    <optgroup label="📌 分組突破（9 + 11 + 11 + 11）">
                        <option value="PROSE_9">📗 古文名家組 (9位：韓柳與北宋7家)</option>
                        <option value="TANG_1">📘 隋唐五代【第 1 組】(11位：魏徵～李頎)</option>
                        <option value="TANG_2">📘 隋唐五代【第 2 組】(11位：王昌齡～白居易)</option>
                        <option value="TANG_3">📘 隋唐五代【第 3 組】(11位：白行簡～李煜)</option>
                    </optgroup>
                    <optgroup label="🎯 綜合總複習">
                        <option value="EXAM_ALL">🎯 測驗指定總範圍綜合 (全42位)</option>
                        <option value="TANG_33">📙 其餘 33 位綜合 (第1～3組合併)</option>
                        <option value="SUI_TANG">📙 P169-174 隋唐五代十國全綜合 (含韓柳35位)</option>
                        <option value="BOOK_ALL">📚 課本同頁全收錄含擴充 (58位)</option>
                    </optgroup>
                </select>
                <div class="text-sm font-bold bg-indigo-100/90 px-4 py-1.5 rounded-full shadow-sm text-indigo-900 whitespace-nowrap">
                    剩餘作家: <span id="progress-text" class="text-rose-600 font-black text-base ml-0.5">0</span>
                </div>
            </div>
        </div>

        <!-- 快捷分組切換按鈕列 -->
        <div class="w-full flex flex-wrap items-center justify-center gap-2 mb-6 bg-indigo-50/70 p-2.5 rounded-2xl border border-indigo-100">
            <button onclick="changeDeck('PROSE_9')" data-deck="PROSE_9" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                📗 古文名家 (9位)
            </button>
            <button onclick="changeDeck('TANG_1')" data-deck="TANG_1" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                📘 第1組：初盛唐 (11位)
            </button>
            <button onclick="changeDeck('TANG_2')" data-deck="TANG_2" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                📘 第2組：盛中唐 (11位)
            </button>
            <button onclick="changeDeck('TANG_3')" data-deck="TANG_3" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                📘 第3組：中晚唐五代 (11位)
            </button>
            <button onclick="changeDeck('TANG_33')" data-deck="TANG_33" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                📙 33位綜合
            </button>
            <button onclick="changeDeck('EXAM_ALL')" data-deck="EXAM_ALL" class="group-pill text-xs sm:text-sm font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-900 border border-indigo-200 cursor-pointer">
                🎯 全42位綜合
            </button>
        </div>

        <!-- 閃卡主體區 -->
        <div id="flashcard-area" class="w-full flex flex-col items-center mb-6 fade-in">
            
            <!-- 作家標題區 (正面) -->
            <div class="w-full text-center mb-5">
                <div class="flex flex-wrap items-center justify-center gap-2 mb-3">
                    <span id="period-badge" class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold tracking-wider">
                        測驗範圍
                    </span>
                    <span id="status-badge" class="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold tracking-wider">
                        🔒 填空待作答（可點擊單格偷看或按下方顯示答案）
                    </span>
                </div>

                <!-- 作家姓名 (帶標準底線) 與生卒年 -->
                <div class="py-2">
                    <span id="author-name" class="target-char text-4xl sm:text-5xl md:text-6xl tracking-widest select-none">
                        作家
                    </span>
                </div>
                <p id="author-years" class="text-slate-500 text-sm sm:text-base font-bold mt-1 tracking-wider">
                    （生卒年）
                </p>
            </div>

            <!-- 統一課本原文重點填空區 -->
            <div class="w-full bg-white/95 border border-indigo-200/90 rounded-2xl p-5 sm:p-7 shadow-md text-left">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-4 pb-2 border-b border-slate-100">
                    <span class="text-xs sm:text-sm font-black text-indigo-900 tracking-wider">
                        📝 課本原文重點填空（出生地保留不考；點擊單一空格可單獨翻開）
                    </span>
                    <div class="flex items-center gap-3 text-xs font-bold">
                        <span class="inline-flex items-center gap-1 text-emerald-700">
                            <span class="w-2.5 h-2.5 rounded-sm bg-emerald-200 border border-emerald-600 inline-block"></span> 朝代／字號／並稱／地位
                        </span>
                        <span class="inline-flex items-center gap-1 text-blue-700">
                            <span class="w-2.5 h-2.5 rounded-sm bg-blue-200 border border-blue-600 inline-block"></span> 《代表作／文集》
                        </span>
                    </div>
                </div>
                <div id="full-text-cloze" class="text-base sm:text-lg md:text-xl text-slate-800 leading-loose font-medium tracking-wide">
                    <!-- 挖空原文將動態渲染於此 -->
                </div>
            </div>

        </div>

        <!-- 互動按鈕區 -->
        <div id="action-buttons" class="w-full flex flex-col sm:flex-row gap-3.5 justify-center fade-in">
            <!-- 顯示答案按鈕 -->
            <button id="btn-reveal" onclick="showAnswer()" class="btn-hover w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg text-lg sm:text-xl border border-indigo-500 cursor-pointer tracking-widest">
                顯示全部答案 (Space)
            </button>

            <!-- 自我評估按鈕 (預設隱藏) -->
            <button id="btn-remembered" onclick="handleEvaluation(true)" class="hidden btn-hover flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg text-lg sm:text-xl border border-emerald-400 cursor-pointer tracking-wider">
                ✅ 完全記得
            </button>
            <button id="btn-forgot" onclick="handleEvaluation(false)" class="hidden btn-hover flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-2xl shadow-lg text-lg sm:text-xl border border-rose-400 cursor-pointer tracking-wider">
                ❌ 有遺漏 / 記錯了
            </button>
        </div>

        <!-- 本輪結算與錯題循環畫面 (預設隱藏) -->
        <div id="result-area" class="w-full hidden flex-col items-center py-8 fade-in text-center">
            <div id="result-icon" class="text-7xl mb-5 drop-shadow-sm">🏆</div>
            <h2 id="result-title" class="text-3xl md:text-4xl font-black text-indigo-950 mb-4 tracking-wider">
                本輪特訓結束！
            </h2>
            <p id="result-desc" class="text-base sm:text-lg md:text-xl text-slate-700 mb-8 leading-relaxed font-medium"></p>
            <button id="result-btn" onclick="startNextRound()" class="btn-hover bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-2xl shadow-lg text-xl cursor-pointer tracking-widest">
                繼續特訓
            </button>
        </div>

    </div>

    <script>
        /**
         * 課本作家與作品完整校對題庫
         * 分組結構：
         * - PROSE_9 : 古文名家 9 位（韓愈、柳宗元、范仲淹、歐陽修、蘇洵、曾鞏、王安石、蘇軾、蘇轍）
         * - TANG_1  : 其餘 33 位之【第 1 組】（11位：魏徵、杜審言、楊炯、王勃、賀知章、張若虛、陳子昂、張九齡、王之渙、孟浩然、李頎）
         * - TANG_2  : 其餘 33 位之【第 2 組】（11位：王昌齡、王維、李白、崔顥、高適、杜甫、岑參、韋應物、孟郊、劉禹錫、白居易）
         * - TANG_3  : 其餘 33 位之【第 3 組】（11位：白行簡、元稹、賈島、李賀、杜牧、溫庭筠、李商隱、韋莊、皮日休、馮延巳、李煜）
         * - TANG_33 : 其餘 33 位綜合（TANG_1 + TANG_2 + TANG_3）
         * - EXAM_ALL: 測驗指定總範圍 42 位綜合（PROSE_9 + TANG_33）
         * - SUI_TANG: P169-174 隋唐五代十國 35 位（TANG_33 + 韓愈 + 柳宗元）
         */
        const rawAuthors = [
            // ==================== 📘 第 1 組：初唐至盛唐上 (11位) ====================
            {
                name: "魏徵",
                years: "580—643",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (1/11) · 初盛唐",
                text: "字[玄成]，巨鹿（今屬河北）人。[唐初]政治家。少時孤貧，出家為道士。隋末參加瓦崗起義軍，降唐後太宗即位，擢為[諫議大夫]，前後陳諫二百餘事。貞觀三年（629）任秘書監，主持校定秘府圖籍，後封[鄭國公]。曾提出「[兼聽則明，偏信則暗]」，多次勸唐太宗以隋亡為鑑，認為君好比舟，民好比水，「[水能載舟，亦能覆舟]」，必須「[居安思危，戒奢以儉]」「薄賦斂，輕租稅」。著有《隋書》的序論，《梁書》《陳書》《北齊書》的總論，主編有《群書治要》，名篇有《諫太宗十思疏》《十漸不克終疏》。"
            },
            {
                name: "杜審言",
                years: "約 645—708",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (2/11) · 初盛唐",
                text: "字[必簡]，祖籍襄陽（今屬湖北），是大詩人[杜甫]的祖父。[初唐]時期的一位重要詩人，是[唐]代「[近體詩]」的奠基人之一。少與[李嶠]、[崔融]、[蘇味道]齊名，並稱「[文章四友]」。作品多樸素自然。有《杜審言詩集》。"
            },
            {
                name: "楊炯",
                years: "650—？",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (3/11) · 初盛唐",
                text: "華陰（今屬陝西）人，[唐]代詩人。與[王勃]、[盧照鄰]、[駱賓王]齊名，並稱「[初唐四傑]」。楊炯以[邊塞征戰]詩著名，《從軍行》《出塞》《戰城南》《紫騮馬》等比較有名。有《盈川集》。"
            },
            {
                name: "王勃",
                years: "約 650—676",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (4/11) · 初盛唐",
                text: "字[子安]，絳州龍門（今山西河津）人。[唐]代文學家。他才華早露，與[楊炯]、[盧照鄰]、[駱賓王]以文辭齊名，並稱「[王楊盧駱]」，亦稱「[初唐四傑]」。後因擅殺官奴而犯罪，其父亦受連累被貶為交趾令，王勃南下探親，落水而亡。其詩作題材較廣泛，意境開闊，風格清新，代表作有《送杜少府之任蜀州》。王勃的賦、序、表、碑、頌等文，多為[駢體]，代表作有《滕王閣序》。著有《王子安集》。"
            },
            {
                name: "賀知章",
                years: "659—約 744",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (5/11) · 初盛唐",
                text: "字[季真]，自號[四明狂客]，[唐]代詩人，越州永興（今浙江杭州）人。少時就以詩文知名，武則天證聖元年（695）中乙未科狀元，後歷任禮部侍郎、秘書監、太子賓客等職。為人曠達不羈，有「[清談風流]」之譽。與[張若虛]、[張旭]、[包融]合稱「[吳中四士]」。其詩文以[絕句]見長，著名的有《詠柳》《回鄉偶書》，作品大多散佚。"
            },
            {
                name: "張若虛",
                years: "約 660—約 720",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (6/11) · 初盛唐",
                text: "揚州（今屬江蘇）人，[唐]代詩人。與[賀知章]、[張旭]、[包融]並稱「[吳中四士]」。其詩在[初唐]詩風轉變中有重要地位。他一生只留下[兩]首詩，其中《春江花月夜》乃千古絕唱，有「[以孤篇壓倒全唐]」之譽，被聞一多譽為「[詩中的詩，頂峰上的頂峰]」。"
            },
            {
                name: "陳子昂",
                years: "661—702",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (7/11) · 初盛唐",
                text: "字[伯玉]，梓州射洪（今屬四川）人，[唐]代文學家、詩人。少任俠，文明進士。以上書論政，為武則天所贊賞，拜麟台正字，轉[右拾遺]（世稱[陳拾遺]）。陳子昂於詩標舉[漢魏風骨]，強調[興寄]，反對柔靡之風，是[唐]代詩歌革新的先驅。其詩風骨崢嶸，寓意深遠，蒼勁有力。名篇有《登幽州台歌》《登澤州城北樓宴》等。"
            },
            {
                name: "張九齡",
                years: "673 或 678—740",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (8/11) · 初盛唐",
                text: "字[子壽]，一名[博物]，韶州曲江（今廣東韶關）人。[唐]代政治家、文學家、詩人，被譽為「[嶺南第一人]」。其[五言古詩]對掃除唐初沿襲的六朝綺靡詩風貢獻尤大，名詩有《感遇》《望月懷遠》等。有《曲江集》。"
            },
            {
                name: "王之渙",
                years: "688—742",
                groups: ["TANG_1", "TANG_33", "EXAM_ALL", "SUI_TANG", "BOOK_ALL"],
                badge: "📘 第 1 組 (9/11) · 初盛唐",
                text: "字[季凌]，晉陽（今山西太原）人。[唐]代詩人。性格豪放不羈，常擊劍悲歌，其詩多被當時樂工制曲歌唱。他常與[高適]、[王昌齡]等相唱和，以善於描寫[邊塞風光]著稱。代表作有《登鸛雀樓》《涼州詞》等。"
            },
            {
                name: "孟浩然",
                years: "689—740",

        const authorNameEl = document.getElementById('author-name');

        const periodBadgeEl = document.getElementById('period-badge');

        const resultBtn = document.getElementById('result-btn');

        // 洗牌演算法
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 將課本原文中的 [考點] 與 《作品》 轉換為互動式填空 DOM
        function buildClozeNodes(rawText) {
            const container = document.createDocumentFragment();
            const regex = /(\[[^\]]+\]|《[^》]+》)/g;
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(rawText)) !== null) {
                if (match.index > lastIndex) {
                    container.appendChild(document.createTextNode(rawText.slice(lastIndex, match.index)));
                }
                const token = match[0];
                const span = document.createElement('span');

                if (token.startsWith('[')) {
                    const cleanVal = token.slice(1, -1);
                    span.className = 'cloze-blank';
                    span.dataset.answer = cleanVal;
                    span.dataset.placeholder = '＿＿';
                    span.textContent = '＿＿';
                    span.title = '點擊單獨翻開此格';
                } else {
                    span.className = 'cloze-work';
                    span.dataset.answer = token;
                    span.dataset.placeholder = '《＿＿》';
                    span.textContent = '《＿＿》';
                    span.title = '點擊單獨翻開此作品';
                }

                span.addEventListener('click', function() {
                    const isNowRevealed = this.classList.toggle('revealed');
                    this.textContent = isNowRevealed ? this.dataset.answer : this.dataset.placeholder;
                });

                container.appendChild(span);
                lastIndex = regex.lastIndex;
            }

            if (lastIndex < rawText.length) {
                container.appendChild(document.createTextNode(rawText.slice(lastIndex)));
            }

            return container;
        }

        // 更新快捷分組按鈕的高亮狀態
        function updatePillHighlight(mode) {
            document.querySelectorAll('.group-pill').forEach(btn => {
                if (btn.dataset.deck === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 切換測驗範圍
        function changeDeck(selectedMode) {
            const mode = selectedMode || deckSelectorEl.value;
            deckSelectorEl.value = mode;
            updatePillHighlight(mode);
            activeDeck = rawAuthors.filter(item => item.groups.includes(mode));
            startNewRound(activeDeck);
        }

        // 初始化（預設載入第一組：古文名家 9 位，方便從頭分段記憶）
        function initGame() {
            changeDeck('PROSE_9');
        }

        // 啟動新一輪
        function startNewRound(cards) {
            currentRoundCards = shuffle(cards);
            wrongCardsForNextRound = [];
            currentIndex = 0;

            flashcardArea.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            resultArea.classList.add('hidden');

            showFront();
        }

        // 顯示題目正面（挖空狀態）
        function showFront() {
            isAnswered = false;
            currentCard = currentRoundCards[currentIndex];
            progressTextEl.innerText = currentRoundCards.length - currentIndex;

            authorNameEl.innerText = currentCard.name;
            authorYearsEl.innerText = `（${currentCard.years}）`;
            periodBadgeEl.innerText = currentCard.badge;

            statusBadgeEl.innerText = "🔒 填空待作答（可點擊單格偷看或按下方顯示答案）";
            statusBadgeEl.className = "px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold tracking-wider";

            fullTextClozeEl.innerHTML = '';
            fullTextClozeEl.appendChild(buildClozeNodes(currentCard.text));

            btnRemembered.classList.add('hidden');
            btnForgot.classList.add('hidden');
            btnReveal.classList.remove('hidden');
        }

        // 顯示全部答案
        function showAnswer() {
            isAnswered = true;

            statusBadgeEl.innerText = "🔓 答案已全部顯示（請核對您的記憶是否完整）";
            statusBadgeEl.className = "px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold tracking-wider";

            document.querySelectorAll('.cloze-blank, .cloze-work').forEach(el => {
                el.classList.add('revealed');
                el.textContent = el.dataset.answer;
            });

            btnReveal.classList.add('hidden');
            btnRemembered.classList.remove('hidden');
            btnForgot.classList.remove('hidden');
        }

        // 自我評估處理
        function handleEvaluation(remembered) {
            if (!remembered) {
                wrongCardsForNextRound.push(currentCard);
            }

            currentIndex++;
            if (currentIndex >= currentRoundCards.length) {
                showRoundResult();
            } else {
                showFront();
            }
        }

        // 錯題循環輪次
        function startNextRound() {
            startNewRound(wrongCardsForNextRound);
        }

        // 本輪結算畫面
        function showRoundResult() {
            flashcardArea.classList.add('hidden');
            actionButtons.classList.add('hidden');
            resultArea.classList.remove('hidden');

            if (wrongCardsForNextRound.length === 0) {
                document.getElementById('result-icon').innerText = "🎉";
                resultTitle.innerText = "太完美了！本組全數掌握！";
                resultTitle.className = "text-3xl md:text-4xl font-black text-emerald-600 mb-4 tracking-wider";
                resultDesc.innerText = `您已經將本組所有作家的朝代流派、字號世稱、並稱與代表作品全部牢記於心！可以點選上方按鈕切換下一組或綜合模式！`;
                resultBtn.innerText = "再複習一次本組";
                resultBtn.onclick = () => startNewRound(activeDeck);
            } else {
                document.getElementById('result-icon').innerText = "📖";
                resultTitle.innerText = "本輪特訓結束";
                resultTitle.className = "text-3xl md:text-4xl font-black text-indigo-950 mb-4 tracking-wider";
                resultDesc.innerHTML = `您還有 <span class="text-3xl font-black text-rose-600 mx-2">${wrongCardsForNextRound.length}</span> 位作家的字號、並稱或作品不夠熟練。<br><br>系統已自動將他們收錄進錯題本，讓我們立即展開錯題循環特訓！`;
                resultBtn.innerText = "進入錯題複習 ➔";
                resultBtn.onclick = startNextRound;
            }
        }

        // 支援空白鍵快速翻開答案
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && resultArea.classList.contains('hidden')) {
                if (!isAnswered) {
                    e.preventDefault();
                    showAnswer();
                }
            }
        });

        window.onload = initGame;
    </script>
</body>
</html>
